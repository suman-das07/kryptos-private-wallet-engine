<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kryptos- Safe, Fast, Reliable</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Major+Mono+Display&family=Overpass+Mono:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="assets/Screenshot 2026-09-30 182253.png" type="image/x-icon">
</head>
<body>
<div class="wallet-container">
  <form action="">
    <p>Enter Amount</p>
    <input type="number" placeholder="Enter Amount" id="amount" required>
    <p>For What ?</p>
    <input type="text" placeholder="Title" id="title">
    <select name="transactionType" id="transactionType" required>
      <option value="" selected disabled>Select the Type of Transaction</option>
      <option value="deposit">Deposit</option>
      <option value="expense">Withdraw/Expense</option>
    </select>
    <input type="submit" id="submit" value="Add Deposit">
  </form>
</div>
<!-- <div class="transaction-history">
  <h2>Transaction History</h2> -->
</div>
  <script src="app.js"></script>
</body>
</html>
